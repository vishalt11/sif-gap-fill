<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1110" height="840" viewBox="0 0 1110 840"
     role="img" aria-labelledby="title desc">
  <title id="title">Simplified model symbols</title>
  <desc id="desc">Workflow blocks containing simplified model symbols, the training process, and outputs consisting of a predicted SIF map and saved model weights.</desc>

  <defs>
    <style><![CDATA[
      text { font-family: Inter, Arial, Helvetica, sans-serif; fill: #17324d; }
      .header-title { font-size: 28px; font-weight: 700; fill: #ffffff; }
      .header-number { font-size: 24px; font-weight: 800; fill: #0b2a4a; text-anchor: middle; dominant-baseline: middle; }
      .model-label { font-size: 25px; font-weight: 700; text-anchor: middle; }
      .tiny { font-size: 12px; font-weight: 600; fill: #5b7185; text-anchor: middle; }
      .line { fill: none; stroke: #17324d; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
      .skip { fill: none; stroke: #4f8fc5; stroke-width: 2.2; stroke-dasharray: 6 5; }
    ]]></style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 10 5 0 10Z" fill="#17324d"/>
    </marker>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 10 5 0 10Z" fill="#4f8fc5"/>
    </marker>
  </defs>

  <g id="vertical-model-block">
    <!-- Main block matching the Findings panel -->
    <rect x="8" y="8" width="424" height="824" rx="22" fill="#f8fbfd" stroke="#bccbd9" stroke-width="2.5"/>
    <path d="M30 8h380a22 22 0 0 1 22 22v56H8V30A22 22 0 0 1 30 8Z" fill="#0b2a4a"/>
    <circle cx="48" cy="47" r="25" fill="#ffffff"/>
    <text x="48" y="48" class="header-number">4</text>
    <text x="87" y="57" class="header-title">MODELS</text>

    <!-- CNN / U-Net symbol -->
    <g id="model-cnn">
      <rect x="28" y="112" width="384" height="202" rx="16" fill="#edf6ff" stroke="#6aa9df" stroke-width="2.3"/>

      <!-- compact U-shaped encoder-decoder -->
      <g transform="translate(67 145) scale(0.88)">
        <path d="M26 35V12H280V35" class="skip" marker-end="url(#arrowBlue)"/>
        <path d="M78 64V43H228V64" class="skip" marker-end="url(#arrowBlue)"/>

        <!-- input raster stack -->
        <rect x="0" y="36" width="34" height="70" rx="3" fill="#7fb3df" stroke="#295b86" stroke-width="2"/>
        <path d="M6 30h34v70M12 24h34v70" fill="#b7d4eb" stroke="#295b86" stroke-width="2"/>

        <!-- encoder -->
        <rect x="58" y="42" width="38" height="79" rx="3" fill="#f4c879" stroke="#a56618" stroke-width="2"/>
        <rect x="112" y="70" width="42" height="67" rx="3" fill="#efad58" stroke="#a56618" stroke-width="2"/>
        <rect x="169" y="101" width="48" height="51" rx="3" fill="#eb9338" stroke="#a85c12" stroke-width="2"/>

        <!-- decoder -->
        <rect x="232" y="70" width="42" height="67" rx="3" fill="#aa91d2" stroke="#65459c" stroke-width="2"/>
        <rect x="289" y="42" width="38" height="79" rx="3" fill="#c6b3e2" stroke="#65459c" stroke-width="2"/>
        <rect x="343" y="47" width="20" height="69" rx="3" fill="#0b2a4a"/>

        <!-- U path -->
        <path d="M46 69h12M96 81h10v45h6M154 103h9v24h6M217 127h15M274 103h9V81h6M327 81h16" class="line" marker-end="url(#arrow)"/>
      </g>
      <text x="220" y="306" class="model-label" style="font-size:22px;fill:#295b86">CNN</text>
    </g>

    <!-- MLP symbol -->
    <g id="model-mlp">
      <rect x="28" y="330" width="384" height="202" rx="16" fill="#f4effc" stroke="#9b7bd0" stroke-width="2.3"/>

      <g id="fully-connected-network" transform="translate(65 355)">
        <!-- connections -->
        <g stroke="#9b7bd0" stroke-width="1.8" opacity=".75">
          <path d="M18 30 104 22M18 30l86 51M18 65l86-43M18 65l86 16M18 100l86-78M18 100l86-19"/>
          <path d="M104 22 192 39M104 22l88 58M104 81l88-42M104 81l88-1"/>
          <path d="M192 39 276 60M192 80l84-20"/>
        </g>

        <!-- input layer -->
        <circle cx="18" cy="30" r="10" fill="#7fb3df" stroke="#295b86" stroke-width="2"/>
        <circle cx="18" cy="65" r="10" fill="#7fb3df" stroke="#295b86" stroke-width="2"/>
        <circle cx="18" cy="100" r="10" fill="#7fb3df" stroke="#295b86" stroke-width="2"/>

        <!-- hidden layers -->
        <circle cx="104" cy="22" r="12" fill="#aa91d2" stroke="#65459c" stroke-width="2"/>
        <circle cx="104" cy="81" r="12" fill="#aa91d2" stroke="#65459c" stroke-width="2"/>
        <circle cx="192" cy="39" r="12" fill="#c6b3e2" stroke="#65459c" stroke-width="2"/>
        <circle cx="192" cy="80" r="12" fill="#c6b3e2" stroke="#65459c" stroke-width="2"/>

        <!-- scalar output -->
        <circle cx="276" cy="60" r="15" fill="#0b2a4a"/>
        <text x="276" y="65" text-anchor="middle" style="font-size:14px;font-weight:700;fill:#ffffff">ŷ</text>

        <text x="18" y="132" class="tiny">inputs</text>
        <text x="148" y="132" class="tiny">hidden layers</text>
        <text x="276" y="132" class="tiny">output</text>
      </g>
      <text x="220" y="510" class="model-label" style="fill:#7756b3">MLP</text>
    </g>

    <!-- Tree ensemble / XGBoost symbol -->
    <g id="model-xgboost">
      <rect x="28" y="548" width="384" height="258" rx="16" fill="#fff5e8" stroke="#e5a153" stroke-width="2.3"/>

      <g id="boosted-tree-ensemble" transform="translate(52 570)">
        <!-- tree 1 -->
        <g transform="translate(0 0)" class="line">
          <path d="M46 16 23 48M46 16l24 32M23 48 11 78M23 48l18 30M70 48 60 78M70 48l19 30"/>
          <g fill="#f1c75b" stroke="#17324d" stroke-width="2">
            <circle cx="46" cy="16" r="7"/><circle cx="23" cy="48" r="7"/><circle cx="70" cy="48" r="7"/><circle cx="11" cy="78" r="7"/><circle cx="41" cy="78" r="7"/><circle cx="60" cy="78" r="7"/><circle cx="89" cy="78" r="7"/>
          </g>
        </g>

        <!-- tree 2 -->
        <g transform="translate(108 0)" class="line">
          <path d="M46 16 23 48M46 16l24 32M23 48 11 78M23 48l18 30M70 48 60 78M70 48l19 30"/>
          <g fill="#efad58" stroke="#17324d" stroke-width="2">
            <circle cx="46" cy="16" r="7"/><circle cx="23" cy="48" r="7"/><circle cx="70" cy="48" r="7"/><circle cx="11" cy="78" r="7"/><circle cx="41" cy="78" r="7"/><circle cx="60" cy="78" r="7"/><circle cx="89" cy="78" r="7"/>
          </g>
        </g>

        <!-- tree k -->
        <g transform="translate(216 0)" class="line">
          <path d="M46 16 23 48M46 16l24 32M23 48 11 78M23 48l18 30M70 48 60 78M70 48l19 30"/>
          <g fill="#e88a2d" stroke="#17324d" stroke-width="2">
            <circle cx="46" cy="16" r="7"/><circle cx="23" cy="48" r="7"/><circle cx="70" cy="48" r="7"/><circle cx="11" cy="78" r="7"/><circle cx="41" cy="78" r="7"/><circle cx="60" cy="78" r="7"/><circle cx="89" cy="78" r="7"/>
          </g>
        </g>

        <text x="46" y="104" class="tiny">f₁(x)</text>
        <text x="154" y="104" class="tiny">f₂(x)</text>
        <text x="262" y="104" class="tiny">fₖ(x)</text>
        <text x="208" y="61" style="font-size:24px;font-weight:700;fill:#5b7185">…</text>

        <!-- ensemble formula as the prediction symbol -->
        <path d="M46 112v18h216v-18" class="line"/>
        <path d="M154 130v18" class="line" marker-end="url(#arrow)"/>
        <rect x="76" y="151" width="157" height="49" rx="12" fill="#0b2a4a"/>
        <text x="154" y="183" text-anchor="middle" style="font-family:Georgia,serif;font-size:24px;font-weight:700;fill:#ffffff">ŷ = Σₖ fₖ(x)</text>
      </g>
      <text x="220" y="790" class="model-label" style="fill:#c86e16">XGBoost</text>
    </g>
  </g>

  <!-- TRAINING PROCESS BLOCK -->
  <g id="training-process-block">
    <rect x="458" y="8" width="304" height="824" rx="22" fill="#f8fbfd" stroke="#bccbd9" stroke-width="2.5"/>
    <path d="M480 8h260a22 22 0 0 1 22 22v82H458V30a22 22 0 0 1 22-22Z" fill="#0b2a4a"/>
    <circle cx="497" cy="48" r="25" fill="#ffffff"/>
    <text x="497" y="49" class="header-number">5</text>
    <text x="538" y="48" class="header-title" style="font-size:25px">TRAINING</text>
    <text x="538" y="79" class="header-title" style="font-size:25px">PROCESS</text>

    <!-- supervised training gears -->
    <g id="supervised-training-symbol" transform="translate(504 148)">
      <g transform="translate(0 30)">
        <circle cx="45" cy="45" r="31" fill="#edf6ff" stroke="#0b2a4a" stroke-width="3"/>
        <circle cx="45" cy="45" r="13" fill="#ffffff" stroke="#0b2a4a" stroke-width="3"/>
        <path d="M45 2v12M45 76v12M2 45h12M76 45h12M15 15l9 9M66 66l9 9M75 15l-9 9M24 66l-9 9" stroke="#0b2a4a" stroke-width="7" stroke-linecap="square"/>
      </g>
      <g transform="translate(74 0)">
        <circle cx="45" cy="45" r="31" fill="#edf6ff" stroke="#0b2a4a" stroke-width="3"/>
        <circle cx="45" cy="45" r="13" fill="#ffffff" stroke="#0b2a4a" stroke-width="3"/>
        <path d="M45 2v12M45 76v12M2 45h12M76 45h12M15 15l9 9M66 66l9 9M75 15l-9 9M24 66l-9 9" stroke="#0b2a4a" stroke-width="7" stroke-linecap="square"/>
      </g>
    </g>
    <text x="610" y="294" text-anchor="middle" style="font-size:23px;font-weight:700;fill:#17324d">Supervised</text>
    <text x="610" y="322" text-anchor="middle" style="font-size:23px;font-weight:700;fill:#17324d">Training</text>

    <!-- downward process arrow -->
    <path d="M610 346v40" fill="none" stroke="#17324d" stroke-width="3" stroke-linecap="round"/>
    <path d="M597 383l13 20 13-20Z" fill="#17324d"/>

    <!-- Huber loss optimization -->
    <g id="huber-optimization-symbol" transform="translate(515 415)">
      <path d="M7 103h184M99 108V10" class="line"/>
      <!-- Huber curve: quadratic centre and linear tails -->
      <path d="M24 26 67 79 C79 94 89 101 99 101 C109 101 119 94 131 79 L174 26" fill="none" stroke="#147b78" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M54 18v55M144 18v55" stroke="#3c9994" stroke-width="2" stroke-dasharray="5 4"/>
      <!-- optimization arrow toward minimum -->
      <path d="M168 8 C146 4 124 15 108 37 C100 48 99 62 99 82" fill="none" stroke="#4f8fc5" stroke-width="5" stroke-linecap="round"/>
      <path d="M88 76l11 21 11-21Z" fill="#4f8fc5"/>
      <circle cx="99" cy="101" r="6" fill="#0b2a4a"/>
    </g>
    <text x="610" y="550" text-anchor="middle" style="font-size:23px;font-weight:700;fill:#17324d">Huber Loss</text>
    <text x="610" y="578" text-anchor="middle" style="font-size:23px;font-weight:700;fill:#17324d">Optimization</text>

    <!-- downward process arrow -->
    <path d="M610 599v39" fill="none" stroke="#17324d" stroke-width="3" stroke-linecap="round"/>
    <path d="M597 635l13 20 13-20Z" fill="#17324d"/>

    <!-- early stopping clock and circular arrow -->
    <g id="early-stopping-symbol" transform="translate(537 651)">
      <path d="M125 38a58 58 0 1 1-18-24" fill="none" stroke="#0b2a4a" stroke-width="5" stroke-linecap="round"/>
      <path d="M105 2l22 6-12 20" fill="#edf6ff" stroke="#0b2a4a" stroke-width="5" stroke-linejoin="round"/>
      <circle cx="70" cy="58" r="42" fill="#ffffff" stroke="#4f8fc5" stroke-width="3"/>
      <path d="M70 31v29L52 70" fill="none" stroke="#0b2a4a" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="70" cy="60" r="6" fill="#0b2a4a"/>
    </g>
    <text x="610" y="807" text-anchor="middle" style="font-size:23px;font-weight:700;fill:#17324d">Early Stopping</text>
  </g>

  <!-- OUTPUTS BLOCK -->
  <g id="outputs-block">
    <rect x="780" y="8" width="322" height="824" rx="22" fill="#f8fbfd" stroke="#bccbd9" stroke-width="2.5"/>
    <path d="M802 8h278a22 22 0 0 1 22 22v56H780V30a22 22 0 0 1 22-22Z" fill="#0b2a4a"/>
    <circle cx="820" cy="47" r="25" fill="#ffffff"/>
    <text x="820" y="48" class="header-number">6</text>
    <text x="860" y="57" class="header-title">OUTPUTS</text>

    <!-- Predicted SIF map -->
    <g id="output-sif-map">
      <rect x="800" y="112" width="282" height="315" rx="16" fill="#e9f7f6" stroke="#3c9994" stroke-width="2.3"/>
      <g id="sif-heatmap" transform="translate(829 142)">
        <rect width="196" height="196" rx="9" fill="#ffffff" stroke="#147b78" stroke-width="2.5"/>
        <g transform="translate(8 8)">
          <!-- row 1 -->
          <rect x="0" y="0" width="30" height="30" fill="#3b528b"/><rect x="30" y="0" width="30" height="30" fill="#2c728e"/><rect x="60" y="0" width="30" height="30" fill="#21918c"/><rect x="90" y="0" width="30" height="30" fill="#28ae80"/><rect x="120" y="0" width="30" height="30" fill="#5ec962"/><rect x="150" y="0" width="30" height="30" fill="#fde725"/>
          <!-- row 2 -->
          <rect x="0" y="30" width="30" height="30" fill="#440154"/><rect x="30" y="30" width="30" height="30" fill="#3b528b"/><rect x="60" y="30" width="30" height="30" fill="#2c728e"/><rect x="90" y="30" width="30" height="30" fill="#21918c"/><rect x="120" y="30" width="30" height="30" fill="#28ae80"/><rect x="150" y="30" width="30" height="30" fill="#5ec962"/>
          <!-- row 3 -->
          <rect x="0" y="60" width="30" height="30" fill="#3b528b"/><rect x="30" y="60" width="30" height="30" fill="#2c728e"/><rect x="60" y="60" width="30" height="30" fill="#21918c"/><rect x="90" y="60" width="30" height="30" fill="#ffffff"/><rect x="120" y="60" width="30" height="30" fill="#ffffff"/><rect x="150" y="60" width="30" height="30" fill="#28ae80"/>
          <!-- row 4 -->
          <rect x="0" y="90" width="30" height="30" fill="#2c728e"/><rect x="30" y="90" width="30" height="30" fill="#21918c"/><rect x="60" y="90" width="30" height="30" fill="#ffffff"/><rect x="90" y="90" width="30" height="30" fill="#ffffff"/><rect x="120" y="90" width="30" height="30" fill="#28ae80"/><rect x="150" y="90" width="30" height="30" fill="#5ec962"/>
          <!-- row 5 -->
          <rect x="0" y="120" width="30" height="30" fill="#21918c"/><rect x="30" y="120" width="30" height="30" fill="#28ae80"/><rect x="60" y="120" width="30" height="30" fill="#5ec962"/><rect x="90" y="120" width="30" height="30" fill="#28ae80"/><rect x="120" y="120" width="30" height="30" fill="#21918c"/><rect x="150" y="120" width="30" height="30" fill="#2c728e"/>
          <!-- row 6 -->
          <rect x="0" y="150" width="30" height="30" fill="#5ec962"/><rect x="30" y="150" width="30" height="30" fill="#fde725"/><rect x="60" y="150" width="30" height="30" fill="#5ec962"/><rect x="90" y="150" width="30" height="30" fill="#28ae80"/><rect x="120" y="150" width="30" height="30" fill="#2c728e"/><rect x="150" y="150" width="30" height="30" fill="#3b528b"/>
          <path d="M30 0v180M60 0v180M90 0v180M120 0v180M150 0v180M0 30h180M0 60h180M0 90h180M0 120h180M0 150h180" stroke="#ffffff" stroke-width="1" opacity=".32"/>
        </g>
        <!-- map contour and resolution marker -->
        <path d="M20 153c23-35 48-12 63-42 13-27 40-31 57-10 15 19 29 6 42-17" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" opacity=".82"/>
        <rect x="125" y="160" width="55" height="22" rx="7" fill="#0b2a4a"/>
        <text x="153" y="176" text-anchor="middle" style="font-size:13px;font-weight:700;fill:#ffffff">20 m</text>
      </g>
      <!-- compact SIF color scale -->
      <g transform="translate(1036 159)">
        <rect width="14" height="24" fill="#fde725"/><rect y="24" width="14" height="24" fill="#5ec962"/><rect y="48" width="14" height="24" fill="#28ae80"/><rect y="72" width="14" height="24" fill="#21918c"/><rect y="96" width="14" height="24" fill="#2c728e"/><rect y="120" width="14" height="24" fill="#3b528b"/><rect y="144" width="14" height="24" fill="#440154"/>
        <path d="M0 0h14v168H0Z" fill="none" stroke="#17324d" stroke-width="1.5"/>
        <text x="7" y="-7" text-anchor="middle" style="font-size:12px;font-weight:700;fill:#17324d">SIF</text>
      </g>
      <text x="941" y="396" class="model-label" style="fill:#147b78">Output SIF Map</text>
    </g>

    <!-- Saved model weights -->
    <g id="output-model-weights">
      <rect x="800" y="447" width="282" height="350" rx="16" fill="#edf6ff" stroke="#6aa9df" stroke-width="2.3"/>

      <!-- stacked weight matrices -->
      <g id="weight-matrices" transform="translate(822 492)">
        <rect x="20" y="20" width="108" height="108" rx="7" fill="#f4d19a" stroke="#c86e16" stroke-width="2"/>
        <rect x="10" y="10" width="108" height="108" rx="7" fill="#d7c8ef" stroke="#7756b3" stroke-width="2"/>
        <rect width="108" height="108" rx="7" fill="#cfe6f7" stroke="#4f8fc5" stroke-width="2.5"/>
        <path d="M27 0v108M54 0v108M81 0v108M0 27h108M0 54h108M0 81h108" stroke="#ffffff" stroke-width="2"/>
        <g fill="#295b86">
          <circle cx="14" cy="14" r="4"/><circle cx="41" cy="14" r="4"/><circle cx="68" cy="14" r="4"/><circle cx="95" cy="14" r="4"/>
          <circle cx="14" cy="41" r="4"/><circle cx="41" cy="41" r="4"/><circle cx="68" cy="41" r="4"/><circle cx="95" cy="41" r="4"/>
          <circle cx="14" cy="68" r="4"/><circle cx="41" cy="68" r="4"/><circle cx="68" cy="68" r="4"/><circle cx="95" cy="68" r="4"/>
          <circle cx="14" cy="95" r="4"/><circle cx="41" cy="95" r="4"/><circle cx="68" cy="95" r="4"/><circle cx="95" cy="95" r="4"/>
        </g>
        <text x="54" y="151" text-anchor="middle" style="font-size:15px;font-weight:700;fill:#5b7185">W₁  W₂  …</text>
      </g>

      <path d="M954 552h30" class="line" marker-end="url(#arrow)"/>

      <!-- trained checkpoint file -->
      <g id="saved-checkpoint" transform="translate(985 486)">
        <path d="M0 0h58l24 24v105H0Z" fill="#ffffff" stroke="#0b2a4a" stroke-width="3" stroke-linejoin="round"/>
        <path d="M58 0v24h24" fill="#dceeff" stroke="#0b2a4a" stroke-width="3" stroke-linejoin="round"/>
        <circle cx="41" cy="61" r="25" fill="#e9f7f6" stroke="#3c9994" stroke-width="2"/>
        <text x="41" y="69" text-anchor="middle" style="font-family:Georgia,serif;font-size:27px;font-weight:700;fill:#147b78">θ*</text>
        <path d="M23 103l10 10 24-28" fill="none" stroke="#5b8d3d" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
      </g>

      <text x="941" y="699" class="model-label" style="fill:#295b86">Model Weights</text>
      <rect x="844" y="729" width="194" height="43" rx="11" fill="#0b2a4a"/>
      <text x="941" y="757" text-anchor="middle" style="font-size:18px;font-weight:700;fill:#ffffff">trained checkpoint</text>
    </g>
  </g>
</svg>
