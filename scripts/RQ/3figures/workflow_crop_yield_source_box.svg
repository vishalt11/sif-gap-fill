<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="800" height="760" viewBox="0 0 800 760"
     role="img" aria-labelledby="title desc">
  <title id="title">Crop yield source box and preprocessing panel</title>
  <desc id="desc">Editable workflow components showing a crop-yield source table and five preprocessing stages: SIF quality control, grid alignment, feature construction, normalization, and 4 kilometre grouping.</desc>

  <defs>
    <style><![CDATA[
      text { font-family: Inter, Arial, Helvetica, sans-serif; fill: #17324d; }
      .card-title { font-size: 26px; font-weight: 700; fill: #5b8d3d; }
      .header-text { font-size: 14px; font-weight: 700; fill: #ffffff; text-anchor: middle; dominant-baseline: middle; }
      .cell-text { font-size: 14px; font-weight: 600; fill: #29472a; text-anchor: middle; dominant-baseline: middle; }
      .caption { font-size: 17px; font-weight: 500; fill: #5b7185; text-anchor: middle; }
      .caption-bold { font-size: 15px; font-weight: 700; fill: #5b7185; text-anchor: middle; }
      .icon { fill: none; stroke: #17324d; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
      .prep-title { font-size: 27px; font-weight: 700; fill: #ffffff; }
      .prep-number { font-size: 25px; font-weight: 800; fill: #0b2a4a; text-anchor: middle; dominant-baseline: middle; }
      .stage-label { font-size: 25px; font-weight: 700; fill: #17324d; dominant-baseline: middle; }
      .stage-card { fill: #ffffff; stroke: #3c9994; stroke-width: 2.2; }
      .flow-line { fill: none; stroke: #17324d; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
    ]]></style>
  </defs>

  <g id="crop-yield-source-card">
    <rect x="8" y="8" width="294" height="344" rx="22" fill="#eff8e9" stroke="#76a95d" stroke-width="2.5"/>

    <!-- table/source icon -->
    <g id="table-icon" transform="translate(25 24)">
      <rect x="0" y="0" width="38" height="38" rx="4" fill="#ffffff" class="icon"/>
      <path d="M0 12h38M0 25h38M13 0v38M27 0v38" class="icon" stroke-width="1.8"/>
      <path d="M7 32 16 23 22 27 32 15" fill="none" stroke="#5b8d3d" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <text x="79" y="54" class="card-title">Crop yield</text>

    <!-- compact tabular mini-figure -->
    <g id="crop-yield-table" transform="translate(26 84)">
      <rect width="258" height="172" rx="10" fill="#ffffff" stroke="#5b8d3d" stroke-width="2.2"/>

      <!-- header -->
      <path d="M10 0h238a10 10 0 0 1 10 10v31H0V10A10 10 0 0 1 10 0Z" fill="#4f8435"/>
      <text x="58" y="21" class="header-text">NUTS-3</text>
      <text x="142" y="21" class="header-text">Year</text>
      <text x="216" y="21" class="header-text">Yield</text>

      <!-- alternating green rows -->
      <rect x="0" y="41" width="258" height="32" fill="#e6f2dc"/>
      <rect x="0" y="73" width="258" height="32" fill="#cfe7bd"/>
      <rect x="0" y="105" width="258" height="32" fill="#b5d99a"/>
      <path d="M0 137h258v25a10 10 0 0 1-10 10H10A10 10 0 0 1 0 162Z" fill="#96c66f"/>

      <!-- column and row rules -->
      <path d="M107 0v172M177 0v172M0 73h258M0 105h258M0 137h258" stroke="#ffffff" stroke-width="1.7" opacity=".95"/>

      <!-- representative table content -->
      <text x="54" y="57" class="cell-text">DE21…</text>
      <text x="142" y="57" class="cell-text">2019</text>
      <text x="217" y="57" class="cell-text">7.2</text>

      <text x="54" y="89" class="cell-text">DE22…</text>
      <text x="142" y="89" class="cell-text">2020</text>
      <text x="217" y="89" class="cell-text">6.8</text>

      <text x="54" y="121" class="cell-text">DE23…</text>
      <text x="142" y="121" class="cell-text">2022</text>
      <text x="217" y="121" class="cell-text">7.5</text>

      <text x="54" y="153" class="cell-text">DE24…</text>
      <text x="142" y="153" class="cell-text">2024</text>
      <text x="217" y="153" class="cell-text">7.0</text>
    </g>

    <text x="155" y="288" class="caption">Annual district yields</text>
    <text x="155" y="318" class="caption-bold">2019–2024 • t ha⁻¹</text>
  </g>

  <!-- PREPROCESSING WORKFLOW COMPONENT -->
  <g id="preprocessing-panel">
    <rect x="335" y="8" width="457" height="744" rx="22" fill="#f8fbfd" stroke="#3c9994" stroke-width="2.5"/>
    <path d="M357 8h413a22 22 0 0 1 22 22v55H335V30a22 22 0 0 1 22-22Z" fill="#147b78"/>
    <circle cx="377" cy="46" r="25" fill="#ffffff"/>
    <text x="377" y="47" class="prep-number">2</text>
    <text x="417" y="56" class="prep-title">PREPROCESSING</text>

    <!-- Stage 1: SIF quality control -->
    <g id="stage-sif-qc">
      <rect x="365" y="108" width="397" height="100" rx="15" class="stage-card"/>
      <g transform="translate(393 121)">
        <circle cx="15" cy="7" r="6" fill="#7fb3df" stroke="#17324d" stroke-width="1.8"/>
        <circle cx="36" cy="7" r="6" fill="#efad58" stroke="#17324d" stroke-width="1.8"/>
        <circle cx="57" cy="7" r="6" fill="#aa91d2" stroke="#17324d" stroke-width="1.8"/>
        <path d="M5 23h62L45 45v24H28V45Z" fill="#7fb3df" stroke="#17324d" stroke-width="3" stroke-linejoin="round"/>
        <circle cx="63" cy="61" r="14" fill="#eff8e9" stroke="#5b8d3d" stroke-width="2"/>
        <path d="M55 61l6 6 11-14" fill="none" stroke="#5b8d3d" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
      </g>
      <text x="505" y="158" class="stage-label">SIF QC</text>
    </g>

    <path d="M564 210v17" class="flow-line"/><path d="M553 225l11 17 11-17Z" fill="#17324d"/>

    <!-- Stage 2: align all predictors to the common 20 m grid -->
    <g id="stage-grid-align">
      <rect x="365" y="237" width="397" height="100" rx="15" class="stage-card"/>
      <g transform="translate(388 249)">
        <rect x="6" y="8" width="48" height="48" rx="3" fill="#edf6ff" stroke="#4f8fc5" stroke-width="2"/>
        <path d="M22 8v48M38 8v48M6 24h48M6 40h48" stroke="#4f8fc5" stroke-width="1.5"/>
        <rect x="18" y="20" width="48" height="48" rx="3" fill="#e9f7f6" fill-opacity=".85" stroke="#147b78" stroke-width="2"/>
        <path d="M34 20v48M50 20v48M18 36h48M18 52h48" stroke="#147b78" stroke-width="1.5"/>
        <path d="M70 38h19" class="flow-line"/>
        <path d="M85 29l14 9-14 9Z" fill="#17324d"/>
        <rect x="103" y="14" width="54" height="54" rx="4" fill="#ffffff" stroke="#17324d" stroke-width="2.5"/>
        <path d="M121 14v54M139 14v54M103 32h54M103 50h54" stroke="#7fb3df" stroke-width="2"/>
        <circle cx="130" cy="41" r="5" fill="#147b78"/>
      </g>
      <text x="570" y="287" class="stage-label">Grid Align</text>
    </g>

    <path d="M564 339v17" class="flow-line"/><path d="M553 354l11 17 11-17Z" fill="#17324d"/>

    <!-- Stage 3: derive indices and auxiliary predictors -->
    <g id="stage-feature-build">
      <rect x="365" y="366" width="397" height="100" rx="15" class="stage-card"/>
      <g transform="translate(392 379)">
        <rect x="22" y="15" width="58" height="54" rx="4" fill="#f8d59e" stroke="#c86e16" stroke-width="2"/>
        <rect x="14" y="9" width="58" height="54" rx="4" fill="#d7c8ef" stroke="#7756b3" stroke-width="2"/>
        <rect x="6" y="3" width="58" height="54" rx="4" fill="#a8d5ae" stroke="#5b8d3d" stroke-width="2"/>
        <path d="M83 36h22" class="flow-line"/>
        <path d="M101 27l14 9-14 9Z" fill="#17324d"/>
        <rect x="119" y="8" width="58" height="58" rx="10" fill="#fff5e8" stroke="#e5a153" stroke-width="2"/>
        <text x="148" y="48" text-anchor="middle" style="font-family:Georgia,serif;font-size:34px;font-weight:700;fill:#c86e16">ƒ</text>
      </g>
      <text x="594" y="416" class="stage-label">Features</text>
    </g>

    <path d="M564 468v17" class="flow-line"/><path d="M553 483l11 17 11-17Z" fill="#17324d"/>

    <!-- Stage 4: training-set standardization -->
    <g id="stage-normalize">
      <rect x="365" y="495" width="397" height="100" rx="15" class="stage-card"/>
      <g transform="translate(391 508)">
        <path d="M6 66h170M91 72V3" class="flow-line"/>
        <path d="M14 63 C32 62 42 56 54 43 C67 29 74 17 91 17 C108 17 115 29 128 43 C140 56 150 62 168 63" fill="none" stroke="#4f8fc5" stroke-width="4" stroke-linecap="round"/>
        <path d="M91 7v61" stroke="#147b78" stroke-width="2" stroke-dasharray="5 4"/>
        <path d="M30 22h32M121 22h32" stroke="#efad58" stroke-width="3" stroke-linecap="round"/>
        <path d="M56 15l12 7-12 7M127 15l-12 7 12 7" fill="#efad58"/>
        <text x="98" y="17" style="font-size:14px;font-weight:700;fill:#147b78">z</text>
      </g>
      <text x="594" y="545" class="stage-label">Normalize</text>
    </g>

    <path d="M564 597v17" class="flow-line"/><path d="M553 612l11 17 11-17Z" fill="#17324d"/>

    <!-- Stage 5: group observations into 4 km chips -->
    <g id="stage-4km-groups">
      <rect x="365" y="624" width="397" height="100" rx="15" class="stage-card"/>
      <g transform="translate(396 636)">
        <rect x="4" y="3" width="142" height="72" rx="7" fill="#edf6ff" stroke="#4f8fc5" stroke-width="2.5" stroke-dasharray="7 5"/>
        <g fill="#7756b3" fill-opacity=".45" stroke="#65459c" stroke-width="2">
          <ellipse cx="31" cy="27" rx="7" ry="18" transform="rotate(-35 31 27)"/>
          <ellipse cx="55" cy="47" rx="7" ry="18" transform="rotate(-35 55 47)"/>
          <ellipse cx="76" cy="25" rx="7" ry="18" transform="rotate(-35 76 25)"/>
          <ellipse cx="99" cy="49" rx="7" ry="18" transform="rotate(-35 99 49)"/>
          <ellipse cx="122" cy="26" rx="7" ry="18" transform="rotate(-35 122 26)"/>
        </g>
        <path d="M4 64h142" stroke="#4f8fc5" stroke-width="2"/>
        <path d="M4 60v8M146 60v8" stroke="#4f8fc5" stroke-width="2"/>
        <text x="75" y="71" text-anchor="middle" style="font-size:12px;font-weight:700;fill:#295b86">4 km</text>
      </g>
      <text x="594" y="674" class="stage-label">Grouping</text>
    </g>
  </g>
</svg>
